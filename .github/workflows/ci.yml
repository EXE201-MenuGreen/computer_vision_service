name: CI

on:
  pull_request:
    paths:
      - "cv-service/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "cv-service/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cv-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cv-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -q --tb=short

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: cv-service
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f Dockerfile .
