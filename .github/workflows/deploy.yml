name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "cv-service/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/doawnlet/cv-service
  REGISTRY_SERVER: ghcr.io
  RESOURCE_GROUP: cv-service-control
  API_APP_NAME: cv-service-api
  WORKER_APP_NAME: cv-service-worker

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cv-service

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            -t "${IMAGE_NAME}:latest" \
            -f Dockerfile .

      - name: Push image
        run: |
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"

      - name: Set image output
        id: image
        run: echo "image=${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure GHCR private registry credentials
        run: |
          az containerapp registry set \
            --name "${API_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --server "${REGISTRY_SERVER}" \
            --username "${{ secrets.GHCR_USERNAME }}" \
            --password "${{ secrets.GHCR_TOKEN }}"

          az containerapp registry set \
            --name "${WORKER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --server "${REGISTRY_SERVER}" \
            --username "${{ secrets.GHCR_USERNAME }}" \
            --password "${{ secrets.GHCR_TOKEN }}"

      - name: Deploy API image
        run: |
          az containerapp update \
            --name "${API_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ needs.build-and-push.outputs.image }}" \
            --set-env-vars CONTAINER_ROLE=api API_DOCS_ENABLED=true

      - name: Deploy worker image
        run: |
          az containerapp update \
            --name "${WORKER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ needs.build-and-push.outputs.image }}" \
            --args worker \
            --set-env-vars CONTAINER_ROLE=worker
