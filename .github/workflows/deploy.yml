name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "cv-service/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: cv-service

env:
  REGISTRY_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io
  IMAGE_NAME: ai-api

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image
        run: |
          docker build \
            -t "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            -t "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:latest" \
            -f Dockerfile .

      - name: Push image
        run: |
          docker push "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:latest"

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API container app
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ai-api-service
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 8000

  deploy-worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy worker container app
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ai-worker-service
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Image CMD runs uvicorn — override to Celery for the worker app.
      - name: Configure Celery worker command
        run: |
          az containerapp update \
            --name ai-worker-service \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --command celery \
            --args "-A" "app.services.worker" "worker" "--loglevel=info" "--concurrency=1" "--queues=cv"
