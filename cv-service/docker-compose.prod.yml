services:
  cv-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: cv-service:prod
    container_name: cv-service
    env_file: .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cv-service:prod
    container_name: celery-worker
    env_file: .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
    command: >
      celery -A app.services.worker worker
      --loglevel=info
      --concurrency=1
      --queues=cv
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cv-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
