services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY_NAME:-local}.azurecr.io/ai-api:latest
    container_name: ai-api-service
    env_file: .env
    environment:
      APP_ENV: production
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to your Upstash rediss URL with ssl_cert_reqs=CERT_REQUIRED}
      UPSTASH_REDIS_REST_URL: ${REDIS_URL:?Set REDIS_URL to your Upstash rediss URL with ssl_cert_reqs=CERT_REQUIRED}
      CONTAINER_ROLE: api
    ports:
      - "8000:8000"
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY_NAME:-local}.azurecr.io/ai-api:latest
    container_name: ai-worker-service
    env_file: .env
    environment:
      APP_ENV: production
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to your Upstash rediss URL with ssl_cert_reqs=CERT_REQUIRED}
      UPSTASH_REDIS_REST_URL: ${REDIS_URL:?Set REDIS_URL to your Upstash rediss URL with ssl_cert_reqs=CERT_REQUIRED}
      CONTAINER_ROLE: worker
    restart: unless-stopped
