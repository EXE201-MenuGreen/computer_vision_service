

networks:
  menugreen-net:
    name: menugreen-net # shared network — backend repo join vao day
    driver: bridge

services:
  # ── Python CV Microservice ────────────────────────────────
  cv-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-service
    env_file: .env
    ports:
      - "8000:8000" # host:container — backend goi http://cv-service:8000

    depends_on:
      redis:
        condition: service_healthy
    networks:
      - menugreen-net
    restart: unless-stopped
    # Uncomment for GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Celery worker (async jobs) ────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker
    env_file: .env
    command: >
      celery -A app.services.worker worker
      --loglevel=info
      --concurrency=1
      --queues=cv

    depends_on:
      - redis
    networks:
      - menugreen-net
    healthcheck:
      disable: true
    restart: unless-stopped

  # ── Redis (job queue + cache) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cv-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - menugreen-net
    restart: unless-stopped

  # ── Flower (Celery dashboard) — dev only ──────────────────
  flower:
    image: mher/flower:2.0
    container_name: cv-flower
    env_file: .env
    command: celery flower --broker=${REDIS_URL} --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - menugreen-net
    profiles: ["dev"]
